<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sorry Chiya Baby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
      z-index: -1;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-shadow: 2px 2px 4px #000;
      position: relative;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      position: relative;
      width: 100%; /* Ensure buttons container takes full width */
      max-width: 300px; /* Limit width for better control */
    }

    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background-color: #ff4d6d;
      color: white;
      transition: 0.3s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    #floating-btn {
      position: relative; /* Changed from absolute to relative for initial positioning */
      transition: all 0.3s ease-in-out;
    }

    #floating-btn.hovered {
      position: absolute; /* Switch to absolute when hovered */
      transition: all 0.3s ease-in-out;
    }

    /* Responsive Styles */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }

      button {
        font-size: 1rem;
        padding: 12px 20px;
      }

      .buttons {
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<div id="particles-js"></div>

<div class="container">
    <h1>I AM SORRY CHIYA BABY ❤️</h1>
    <div class="buttons">
      <button onclick="alert('Thank you Chiya Baby 😘')">It’s Okk baby🫂</button>
      <button id="floating-btn">Punish Me😭</button>
  </div>
</div>

<script>
  const floatBtn = document.getElementById("floating-btn");
  let moveInterval = null;

  // Get the boundaries of the .buttons container
  function getContainerBounds() {
    const buttonsContainer = document.querySelector(".buttons");
    const rect = buttonsContainer.getBoundingClientRect();
    return {
      minX: rect.left,
      maxX: rect.right - floatBtn.offsetWidth,
      minY: rect.top,
      maxY: rect.bottom - floatBtn.offsetHeight,
    };
  }

  // Random position within the .buttons container
  function getRandomPosition() {
    const { minX, maxX, minY, maxY } = getContainerBounds();
    const x = Math.random() * (maxX - minX) + minX;
    const y = Math.random() * (maxY - minY) + minY;
    return { x, y };
  }

  // Move the button to a random position
  function floatRandomly() {
    const { x, y } = getRandomPosition();
    floatBtn.style.left = `${x}px`;
    floatBtn.style.top = `${y}px`;
  }

  // Start floating on hover
  floatBtn.addEventListener('mouseenter', function() {
    floatBtn.classList.add('hovered');
    floatRandomly(); // Move immediately
    moveInterval = setInterval(floatRandomly, 1000); // Move every 1 second
  });

  // Stop floating when hover ends
  floatBtn.addEventListener('mouseleave', function() {
    floatBtn.classList.remove('hovered');
    clearInterval(moveInterval);
    moveInterval = null;
    // Reset position to original
    floatBtn.style.position = 'relative';
    floatBtn.style.left = '0px';
    floatBtn.style.top = '0px';
  });

  particlesJS("particles-js", {
    "particles": {
      "number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
      "color": { "value": "#ff66b2" },
      "shape": { "type": "circle", "stroke": { "width": 0, "color": "#000000" } },
      "opacity": {
        "value": 0.6,
        "random": true,
        "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false }
      },
      "size": { "value": 10, "random": true },
      "line_linked": { "enable": false },
      "move": {
        "enable": true,
        "speed": 1.5,
        "direction": "top",
        "random": true,
        "out_mode": "out"
      }
    },
    "interactivity": {
      "events": {
        "onhover": { "enable": true, "mode": "repulse" },
        "onclick": { "enable": false }
      }
    },
    "retina_detect": true
  });
</script>

</body>
</html>
